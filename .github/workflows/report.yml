name: report
on:
  push:
    paths: ["report/**"]
  pull_request:
    paths: ["report/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
      - uses: actions/upload-artifact@v4
        if: always()                      # chạy cả khi bước biên dịch thất bại
        with:
          name: report-output
          path: |
            report/main.pdf
            report/main.log
            report/main.blg
          if-no-files-found: ignore